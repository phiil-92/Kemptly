name: Build installer

# Builds WinTidy-Setup.msi + a portable exe.
# Push a tag like v1.1.0 to create a GitHub release with both files attached,
# or run it manually from the Actions tab to just get the build artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build installer
        shell: pwsh
        run: |
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart('v') } else { "1.0.0" }
          ./build-installer.ps1 -Version $v

      - name: Prepare files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item dist/WinTidy-Setup.msi out/
          Copy-Item build/selfcontained/WinTidy.exe out/WinTidy-portable.exe

      - uses: actions/upload-artifact@v4
        with:
          name: WinTidy
          path: out/*

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "${{ github.ref_name }}" out/* --title "WinTidy ${{ github.ref_name }}" --generate-notes

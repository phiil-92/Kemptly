name: Build installer

# Builds Kemptly-Setup.msi + a portable exe.
# Push a tag like v1.1.0 to create a GitHub release with both files attached,
# or run it manually from the Actions tab to just get the build artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build installer
        shell: pwsh
        run: |
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart('v') } else { "1.1.2" }
          ./build-installer.ps1 -Version $v

      - name: Prepare files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item dist/Kemptly-Setup.msi out/
          Copy-Item build/selfcontained/Kemptly.exe out/Kemptly-portable.exe

      - uses: actions/upload-artifact@v5
        with:
          name: Kemptly
          path: out/*

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          # If the release already exists (e.g. created by hand), just refresh its files.
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -eq 0) { gh release upload "${{ github.ref_name }}" out/* --clobber }
          else { gh release create "${{ github.ref_name }}" out/* --title "Kemptly ${{ github.ref_name }}" --generate-notes }

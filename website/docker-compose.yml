# Run with: docker compose up -d --build
# The site is then on http://<server-ip>:8080 (change the left port to 80 to serve it directly).
services:
  web:
    build:
      context: .
      args:
        # Read from .env (not in git), e.g.  CONTACT_EMAIL=you@example.com
        CONTACT_EMAIL: ${CONTACT_EMAIL:?Set CONTACT_EMAIL in .env}
    image: kemptly-web
    container_name: kemptly-web
    ports:
      - "8080:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Keep logs small; deploy/clear-logs.cron empties them daily (see the privacy policy).
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "1"

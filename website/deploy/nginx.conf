# nginx site config for the Kemptly website.
# install.sh copies this to /etc/nginx/sites-available/kemptly and replaces SERVER_NAME and SITE_ROOT.
# The Docker image uses it as-is (listening on 8080, files in /usr/share/nginx/html).

# Privacy: log only shortened IP addresses (GDPR data minimisation).
# IPv4 1.2.3.4 -> 1.2.3.0, IPv6 2001:db8:abcd:12::1 -> 2001:db8:abcd::
map $remote_addr $remote_addr_anon {
    ~^(?P<v4>\d+\.\d+\.\d+)\.\d+$          $v4.0;
    ~^(?P<v6>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*):  $v6::;
    default                                 0.0.0.0;
}
log_format anonymized '$remote_addr_anon [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 8080;
    listen [::]:8080;
    server_name SERVER_NAME;

    root SITE_ROOT;
    index index.html;
    charset utf-8;
    server_tokens off;

    access_log /var/log/nginx/access.log anonymized;
    # The error log would contain full client IPs, so only record critical server problems.
    error_log /var/log/nginx/error.log crit;
    log_not_found off;

    # Strict security headers: the site only loads its own files.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;
    # Browsers only honour HSTS over HTTPS (here: via the Pangolin proxy). No includeSubDomains, so other
    # subdomains of the same domain are unaffected.
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_min_length 512;
    gzip_types text/css application/javascript image/svg+xml image/x-icon;

    location / {
        try_files $uri $uri/ =404;
    }

    # Cache static files for a week ("expires" keeps the security headers above).
    location ~* \.(?:png|ico|css|js)$ {
        expires 7d;
        access_log off;
    }

    # Never serve hidden files (.git, .env, ...).
    location ~ /\. {
        deny all;
    }
}
